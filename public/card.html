<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Generate a high-fidelity carbon footprint card of your planet to share with friends and raise environmental awareness.">
  <meta property="og:title" content="Share Your Planet Card - Carbon Mirror">
  <meta property="og:description" content="Generate a high-fidelity carbon footprint card of your planet.">
  <meta property="og:image" content="/assets/carbon_mirror_icon.png">
  <title>Share Your Planet Card - Carbon Mirror</title>

  <!-- PWA Manifest -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#00E5C3">

  <!-- Performance: Preconnect to critical origins -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://firestore.googleapis.com" crossorigin>
  <link rel="preconnect" href="https://identitytoolkit.googleapis.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500&amp;family=JetBrains+Mono:wght@500&amp;family=Space+Grotesk:wght@700&amp;display=swap" rel="stylesheet">

  <!-- Material Symbols -->
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/reset.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/planet.css">
  <link rel="stylesheet" href="css/animations.css">
</head>
<body>
  <noscript>
    <div style="background-color: #ffcc00; color: #333; padding: 10px; text-align: center; z-index: 9999; position: relative;">
      <strong>JavaScript is disabled!</strong> Carbon Mirror requires JavaScript to calculate your footprint and render your planet.
    </div>
  </noscript>
  <!-- Accessibility skip link -->
  <a href="#main-content" class="skip-link">Skip to main content</a>

  <!-- Top Navigation -->
  <nav class="top-nav" id="main-navigation">
    <div class="nav-container">
      <a href="/" class="headline-md font-bold" style="color: var(--cm-color-accent-teal); text-decoration: none;">Carbon Mirror</a>
      <div class="flex gap-md align-center">
        <a href="dashboard" class="body-md" style="color: var(--cm-color-text-muted); text-decoration: none; display: none;" id="nav-link-dashboard">Dashboard</a>
        <a href="actions" class="body-md" style="color: var(--cm-color-text-muted); text-decoration: none; display: none;" id="nav-link-actions">Action Lab</a>
        <a href="forest" class="body-md" style="color: var(--cm-color-text-muted); text-decoration: none;" id="nav-link-forest">Forest</a>
        <button type="button" class="btn btn-ghost" id="auth-sign-out-btn">Sign Out</button>
      </div>
    </div>
  </nav>

  <!-- Shareable Card Interface -->
  <main class="container page-canvas flex flex-col align-center gap-md" id="main-content" tabindex="-1" style="padding-top: 100px;">
    <header class="text-center" style="max-width: 600px;">
      <h1 class="headline-lg mb-xs">Share Your Planet Card</h1>
      <p class="body-md" style="color: var(--cm-color-text-muted);">
        Generate a beautiful, high-resolution graphic summarizing your planet score and annual footprint.
      </p>
    </header>

    <!-- Scaled Card Canvas Frame -->
    <section class="flex flex-col align-center fade-in-up" id="card-canvas-section" style="width: 100%; max-width: 480px;">
      <div class="glass-card" style="padding: 12px; border-radius: var(--cm-radius-md); overflow: hidden; width: 100%;">
        <canvas id="share-canvas" width="1080" height="1080" style="display: block; width: 100%; aspect-ratio: 1 / 1; border-radius: var(--cm-radius-sm);" aria-label="Visual high-resolution carbon scorecard preview" role="img"></canvas>
      </div>
    </section>

    <!-- Sharing Triggers -->
    <section class="flex gap-md justify-center fade-in-up delay-200" id="card-buttons-section" style="width: 100%; max-width: 480px;">
      <button type="button" class="btn btn-ghost" id="card-download-btn" style="flex: 1;">
        <span class="material-symbols-outlined" aria-hidden="true">download</span>
        <span>Download Card</span>
      </button>
      <button type="button" class="btn btn-primary" id="card-share-btn" style="flex: 1;">
        <span class="material-symbols-outlined" aria-hidden="true">share</span>
        <span>Share Planet</span>
      </button>
    </section>
  </main>

  <!-- Module Entry -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
